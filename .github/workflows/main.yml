name: .NET CI + Coverage + CodeAnt

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup NuGet
        uses: nuget/setup-nuget@v1

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1

      # 🔍 Debug (keep for now)
      - name: List Files
        run: dir -Recurse

      # Restore
      - name: Restore NuGet Packages
        run: |
          $sln = Get-ChildItem -Recurse -Filter *.sln | Select-Object -First 1
          Write-Host "Using solution: $($sln.FullName)"
          nuget restore $sln.FullName

      # Build
      - name: Build Solution
        run: |
          $sln = Get-ChildItem -Recurse -Filter *.sln | Select-Object -First 1
          msbuild $sln.FullName /p:Configuration=Release

      # ✅ Install coverlet collector (PowerShell-safe)
      - name: Install coverlet collector
        run: |
          $proj = Get-ChildItem -Recurse -Filter *.csproj | Where-Object { $_.FullName -like "*Tests*" } | Select-Object -First 1
          if ($null -eq $proj) {
            Write-Error "Test project not found!"
            exit 1
          }
          Write-Host "Adding coverlet to: $($proj.FullName)"
          dotnet add $proj.FullName package coverlet.collector

      # ✅ Run tests with coverage
      - name: Run tests with coverage
        run: |
          $sln = Get-ChildItem -Recurse -Filter *.sln | Select-Object -First 1
          dotnet test $sln.FullName --collect:"XPlat Code Coverage" --results-directory ./TestResults

      # ✅ Find coverage file safely
      - name: Find coverage file
        id: coverage
        run: |
          $file = Get-ChildItem -Recurse -Filter "coverage.cobertura.xml" | Select-Object -First 1
          if ($null -eq $file) {
            Write-Error "Coverage file not found!"
            exit 1
          }
          Write-Host "Coverage file found at: $($file.FullName)"
          echo "file=$($file.FullName)" >> $env:GITHUB_OUTPUT

      # ✅ Prepare coverage file for CodeAnt
      - name: Prepare coverage file
        run: |
          Copy-Item "${{ steps.coverage.outputs.file }}" coverage.xml

      # ✅ Upload coverage to CodeAnt
      - name: Upload coverage to CodeAnt AI
        uses: CodeAnt-AI/codeant-coverage-action@v0.0.5
        with:
          access_token: ${{ secrets.ACCESS_TOKEN_GITHUB }}
          coverage_file: coverage.xml

  codeant-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run CodeAnt CI Scan
        uses: CodeAnt-AI/codeant-ci-scan-action@v0.0.5
        with:
          access_token: ${{ secrets.ACCESS_TOKEN_GITHUB }}
