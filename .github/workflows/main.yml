name: .NET CI + Coverage + CodeAnt

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-test:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup NuGet
      uses: nuget/setup-nuget@v1

    # 🔍 DEBUG (VERY IMPORTANT - KEEP THIS FOR NOW)
    - name: List Files
      run: dir -Recurse

    # ✅ AUTO DETECT SOLUTION
    - name: Restore NuGet Packages
      run: |
        $sln = Get-ChildItem -Recurse -Filter *.sln | Select-Object -First 1
        Write-Host "Using solution: $($sln.FullName)"
        nuget restore $sln.FullName

    - name: Build Solution
      run: |
        $sln = Get-ChildItem -Recurse -Filter *.sln | Select-Object -First 1
        msbuild $sln.FullName /p:Configuration=Release

    - name: Run Tests with Coverage
      run: |
        vstest.console.exe **\*test*.dll /EnableCodeCoverage

    - name: Install ReportGenerator
      run: dotnet tool install -g dotnet-reportgenerator-globaltool

    - name: Generate Coverage Report
      run: |
        reportgenerator -reports:**/*.coverage -targetdir:coveragereport

    - name: Upload Coverage
      uses: actions/upload-artifact@v4
      with:
        name: CoverageReport
        path: coveragereport

    - name: Run CodeAnt Scan
      run: |
        curl -X POST "https://api.codeant.ai/scan" ^
        -H "Authorization: Bearer ${{ secrets.CODEANT_API_KEY }}" ^
        -d "repo=${{ github.repository }}"
