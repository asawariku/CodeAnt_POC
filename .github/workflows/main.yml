name: .NET Framework CI + Coverage + CodeAnt

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  solution: 'samples/core/getting-started/unit-testing-using-mstest/*.sln'
  buildConfiguration: 'Release'

jobs:
  build-test:
    runs-on: windows-latest

    steps:
    # 🔹 Checkout code
    - name: Checkout
      uses: actions/checkout@v4

    # 🔹 Setup NuGet
    - name: Setup NuGet
      uses: nuget/setup-nuget@v1

    # 🔹 Restore packages
    - name: Restore NuGet Packages
      run: nuget restore ${{ env.solution }}

    # 🔹 Build solution
    - name: Build Solution
      run: msbuild ${{ env.solution }} /p:Configuration=${{ env.buildConfiguration }}

    # 🔹 Run tests with coverage
    - name: Run Tests with Code Coverage
      run: |
        vstest.console.exe **\*test*.dll /EnableCodeCoverage

    # 🔹 Install ReportGenerator tool
    - name: Install ReportGenerator
      run: dotnet tool install -g dotnet-reportgenerator-globaltool

    # 🔹 Generate readable coverage report
    - name: Generate Coverage Report
      run: |
        reportgenerator -reports:**/*.coverage -targetdir:coveragereport

    # 🔹 Upload coverage report
    - name: Upload Coverage Report
      uses: actions/upload-artifact@v4
      with:
        name: CoverageReport
        path: coveragereport

    # 🔹 Run CodeAnt Scan
    - name: Run CodeAnt Scan
      run: |
        curl -X POST "https://api.codeant.ai/scan" ^
        -H "Authorization: Bearer ${{ secrets.CODEANT_API_KEY }}" ^
        -d "repo=${{ github.repository }}"
