name: .NET CI + Coverage + CodeAnt

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup NuGet
        uses: nuget/setup-nuget@v1

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1

      # 🔍 Debug (keep for now)
      - name: List Files
        run: dir -Recurse

      # Restore
      - name: Restore NuGet Packages
        run: |
          $sln = Get-ChildItem -Recurse -Filter *.sln | Select-Object -First 1
          Write-Host "Using solution: $($sln.FullName)"
          nuget restore $sln.FullName

      # Build
      - name: Build Solution
        run: |
          $sln = Get-ChildItem -Recurse -Filter *.sln | Select-Object -First 1
          msbuild $sln.FullName /p:Configuration=Release

      - name: Run tests with coverage
        run: |
          # Your test command that generates coverage report
          pytest --cov --cov-report=xml

      - name: Upload coverage to CodeAnt AI
        uses: CodeAnt-AI/codeant-coverage-action@v0.0.5
        with:
          access_token: ${{ secrets.ACCESS_TOKEN_GITHUB }}
          coverage_file: coverage.xml

